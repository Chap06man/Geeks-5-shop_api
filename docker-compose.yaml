version: '3'
services: 
  shop_api:
    build:
      context: .
    command: sh -c "python manage.py runserver 0.0.0.0:8000"
    ports: 
      - '8002:8000' #host conteiner 
    depends_on:
      - shop_db
  shop_db:
    image: 'postgres:14'
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
    volumes:
    - 'data:/var/libpostgresql/data'
volumes:
  data: